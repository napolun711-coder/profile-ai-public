name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --no-dev
      - name: Compile Python
        run: .venv\Scripts\python.exe -m compileall -q app scripts
      - name: Unit tests
        run: .venv\Scripts\python.exe -m unittest discover -s tests -t . -v
