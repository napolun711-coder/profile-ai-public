<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>需要授权 · 本地知识库助手</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(circle at 50% 0,#e7efff,transparent 55%),#f5f7fb;
  color:#182033;font:15px/1.7 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.card{width:min(500px,100%);background:#fff;border:1px solid #dfe5ef;border-radius:20px;
  padding:28px;box-shadow:0 20px 60px rgba(23,38,72,.12)}
.mark{width:48px;height:48px;border-radius:14px;background:#e8efff;color:#2563eb;
  display:grid;place-items:center;font-size:24px;margin-bottom:16px}
h1{font-size:21px;margin:0 0 8px}
p{color:#65708a;font-size:14px;margin:0 0 14px}
ol{margin:0 0 18px;padding-left:21px;color:#46516a}
li{margin:7px 0}
button{width:100%;min-height:46px;border:0;border-radius:11px;background:#2563eb;
  color:#fff;font:inherit;font-weight:700;cursor:pointer}
.link-btn{display:block;text-align:center;text-decoration:none;width:100%;min-height:46px;
  line-height:46px;border-radius:11px;background:#2563eb;color:#fff;font-weight:700;margin-bottom:9px}
.plain-btn{background:#eef2f8;color:#334155}
.hint{font-size:12.5px;color:#65708a;margin-top:12px}
</style>
</head>
<body>
<main class="card">
  <div class="mark">6位</div>
  <h1>这台设备尚未授权</h1>
  <p>为避免同一局域网中的其他设备读取会话、记忆和资料，本应用使用一次性六位数字授权。</p>
  <ol>
    <li>在电脑上打开 <b>设置 → 上传与运行 → 局域网设备授权</b>。</li>
    <li>点击“生成六位授权码”，电脑会显示数字和访问地址。</li>
    <li>在当前设备打开该地址，输入六位数字和设备名后确认。</li>
    <li>授权完成后会自动进入聊天页面。</li>
  </ol>
  <a class="link-btn" href="/pair">输入六位授权码</a>
  <button id="retry" class="plain-btn" type="button">已授权，重新检测</button>
  <div class="hint">六位码 5 分钟有效且只能使用一次。电脑端可随时删除已授权设备。</div>
</main>
<script src="/static/session.js" defer></script>
<script>
(function(){
  const button = document.getElementById('retry');
  async function check(){
    button.disabled = true;
    try {
      const r = await fetch('/api/app/access/status', {cache:'no-store'});
      const data = await r.json();
      if (data && data.authorized) { location.replace('/web'); return; }
    } catch (err) {}
    button.disabled = false;
  }
  button.addEventListener('click', check);
  setInterval(check, 3000);
})();
</script>
</body>
</html>
