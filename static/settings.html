<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/static/access_gate.js"></script>
<title>设置 - 本地知识库助手</title>
<link rel="stylesheet" href="/static/theme.css">
<script src="/static/theme.js"></script>
<style>
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans)}
a{color:var(--brand);text-decoration:none}
.header{position:sticky;top:0;z-index:30;height:58px;background:var(--panel);display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line)}
.logo{width:32px;height:32px;border-radius:9px;background:var(--logo-gradient);display:grid;place-items:center;color:var(--on-brand);font-size:12px;font-weight:700}
.header h1{font-size:16px;margin:0}.spacer{flex:1}
.layout{display:flex;align-items:flex-start;gap:18px;max-width:1120px;margin:18px auto 92px;padding:0 16px}
.nav{position:sticky;top:76px;width:190px;flex:0 0 190px;background:var(--panel);border:1px solid var(--side-line);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px}
.nav-title{font-size:12px;color:var(--muted);padding:2px 7px 8px}
.nav-item{display:flex;gap:8px;padding:8px;border-radius:8px;color:var(--side-text-dim);font-size:13px;cursor:pointer}
.nav-item:hover,.nav-item.active{background:var(--side-accent-soft);color:var(--brand-2)}
.main{flex:1;min-width:0}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;scroll-margin-top:76px}
.card>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 16px;user-select:none}
.card>summary::-webkit-details-marker{display:none}
.card>summary:hover{background:var(--grey-bg)}
.num{width:24px;height:24px;border-radius:8px;background:var(--brand-chip);color:var(--brand-2);display:grid;place-items:center;font-size:12px;font-weight:700}
.card h2{font-size:15px;margin:0}.summary{margin-left:auto;color:var(--muted);font-size:12px;max-width:50%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-body{padding:0 16px 16px;border-top:1px solid var(--line)}
.hint{font-size:12px;color:var(--muted);line-height:1.6;margin:12px 0}
.row{display:grid;grid-template-columns:155px minmax(0,1fr) auto;gap:9px;align-items:center;margin:9px 0}
.row label{font-size:13px;color:var(--grey-text)}
.row input,.row select{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-input);color:var(--text);font:inherit;font-size:14px;min-height:38px}
.row input:focus,.row select:focus{outline:none;border-color:var(--brand-line-focus);box-shadow:var(--focus-ring)}
.row .sub{grid-column:2/4;font-size:12px;color:var(--muted);margin-top:-4px}
.ghost{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:8px 10px;cursor:pointer}
.ghost:hover{color:var(--bad-text);border-color:var(--bad-line)}
.ghost.pending{color:var(--warn-text);border-color:var(--warn-line);background:var(--warn-soft)}
.subhead{font-size:13px;font-weight:700;margin:16px 0 6px;color:var(--grey-text)}
.note{font-size:12px;line-height:1.6;color:var(--muted);padding:9px 11px;border-radius:9px;background:var(--grey-bg);border:1px solid var(--line)}
.note.ok{color:var(--ok-text);background:var(--ok-soft);border-color:var(--ok-line)}
.note.warn{color:var(--warn-text);background:var(--warn-soft);border-color:var(--warn-line)}
.advanced{margin:10px 0;border:1px dashed var(--line);border-radius:9px;padding:8px 10px}
.advanced>summary{cursor:pointer;font-size:12px;color:var(--muted)}
.device-list{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.device{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:9px}
.device-main{flex:1;min-width:0}.device-name{font-size:13px;font-weight:600}.device-meta{font-size:11px;color:var(--muted);word-break:break-all}
.device-actions{display:flex;gap:6px}.device-actions button{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 9px;cursor:pointer}
.device-actions .allow{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.pair-box{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--grey-bg)}
.pair-url{flex:1;min-width:220px;font-size:12px;word-break:break-all;color:var(--brand-2)}
table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600}td:first-child{width:170px;color:var(--grey-text)}
.checks{list-style:none;padding:0;margin:8px 0}.checks li{padding:7px 0;border-bottom:1px dashed var(--line);font-size:12px}.ok{color:var(--ok-text)}.bad{color:var(--bad-text)}.muted{color:var(--muted)}
.bar{position:sticky;bottom:0;z-index:20;display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 18px;background:var(--glass-strong);border-top:1px solid var(--line)}
.btn{min-height:38px;padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer}.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}.btn:disabled{opacity:.55;cursor:default}
.status{margin-left:auto;font-size:12px;color:var(--muted)}.status.ok{color:var(--ok-text)}.status.bad{color:var(--bad-text)}.dirty{font-size:12px;color:var(--warn-text);background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:999px;padding:3px 9px}
@media(max-width:900px){.layout{display:block}.nav{position:static;width:auto;display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.nav-title{display:none}.nav-item{white-space:nowrap;min-height:40px;align-items:center}.main{width:100%}}
@media(max-width:620px){.header{padding:0 12px}.layout{padding:0 10px;margin-bottom:150px}.card>summary{padding:12px}.card-body{padding:0 12px 12px}.row{grid-template-columns:1fr;gap:4px}.row .sub{grid-column:1}.row input,.row select{font-size:16px;min-height:44px}.ghost{min-height:42px}.bar{padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.bar .btn{flex:1 1 calc(50% - 5px)}.status{flex:1 1 100%;margin-left:0}}
</style>
</head>
<body>
<header class="header"><div class="logo">资料</div><h1>设置</h1><span class="spacer"></span><a href="/web">返回对话</a><button id="themeBtn" class="ghost" type="button" data-theme-toggle>外观</button></header>
<div class="layout">
<nav class="nav" aria-label="设置分组"><div class="nav-title">设置</div><div id="navlist"></div></nav>
<main class="main">
<details class="card" id="sec-models" open><summary><span class="num">1</span><h2>模型</h2><span class="summary" id="sum-models"></span></summary><div class="card-body">
  <p class="hint">生成、嵌入和重排序模型均在此管理。</p>
  <div class="subhead">生成模型</div>
  <div class="row"><label>提供方</label><input type="text" id="llm_binding" list="provider-list" placeholder="openai / ollama / azure_openai / gemini"></div>
  <div class="row"><label>模型</label><input type="text" id="llm_model" placeholder="例如 deepseek-chat"></div>
  <div class="row"><label>接口地址</label><input type="text" id="llm_host" placeholder="https://api.deepseek.com"></div>
  <div class="row"><label>API Key</label><input type="password" id="llm_api_key" placeholder="留空保持不变"><button type="button" class="ghost" data-clear="llm_api_key">清除</button></div>
  <div class="subhead">嵌入模型</div>
  <div class="row"><label>提供方</label><input type="text" id="embedding_binding" list="provider-list" placeholder="ollama / openai"></div>
  <div class="row"><label>模型</label><input type="text" id="embedding_model" placeholder="bge-m3:latest"></div>
  <div class="row"><label>接口地址</label><input type="text" id="embedding_host" placeholder="http://localhost:11434"></div>
  <div class="row"><label>API Key</label><input type="password" id="embedding_api_key" placeholder="本机 Ollama 可留空"><button type="button" class="ghost" data-clear="embedding_api_key">清除</button></div>
  <div class="row"><label>向量维度</label><input type="number" id="embedding_dim" min="1" step="1" placeholder="自动"></div>
  <div class="row"><label>发送维度</label><select id="embedding_send_dim"><option value="">自动</option><option value="true">是</option><option value="false">否</option></select></div>
  <details class="advanced"><summary>重排序模型（可选）</summary>
    <div class="row"><label>提供方</label><select id="rerank_binding"><option value="">未设置</option><option value="null">关闭</option><option value="aliyun">阿里云</option><option value="cohere">Cohere</option><option value="jina">Jina</option></select></div>
    <div class="row"><label>模型</label><input type="text" id="rerank_model"></div>
    <div class="row"><label>接口地址</label><input type="text" id="rerank_host"></div>
    <div class="row"><label>API Key</label><input type="password" id="rerank_api_key" placeholder="留空保持不变"><button type="button" class="ghost" data-clear="rerank_api_key">清除</button></div>
  </details>
  <datalist id="provider-list"><option value="openai"></option><option value="ollama"></option><option value="azure_openai"></option><option value="gemini"></option></datalist>
</div></details>

<details class="card" id="sec-knowledge"><summary><span class="num">2</span><h2>知识库与检索</h2><span class="summary" id="sum-knowledge"></span></summary><div class="card-body">
  <p class="hint">分块和召回参数随设置保存，重启后生效。</p>
  <div class="row"><label>向量存储</label><select id="vector_store_type"><option value="">默认</option><option value="local">本地文件</option><option value="qdrant">Qdrant</option></select></div>
  <div class="row"><label>Qdrant 地址</label><input type="text" id="vector_store_qdrant_url" placeholder="http://localhost:6333"></div>
  <div class="row"><label>分块大小</label><input type="number" id="rag_chunk_size" min="100" max="10000" placeholder="1200"></div>
  <div class="row"><label>分块重叠</label><input type="number" id="rag_chunk_overlap" min="0" max="2000" placeholder="100"></div>
  <div class="row"><label>实体/关系召回</label><input type="number" id="rag_top_k" min="1" max="500" placeholder="50"></div>
  <div class="row"><label>文本片段召回</label><input type="number" id="rag_chunk_top_k" min="1" max="500" placeholder="30"></div>
  <details class="advanced"><summary>存储路径（高级）</summary>
    <div class="row"><label>LightRAG 目录</label><input type="text" id="paths_lightrag_home" placeholder="留空使用默认"></div>
    <div class="row"><label>索引目录</label><input type="text" id="graph_working_dir" placeholder="留空使用默认"></div>
    <div class="row"><label>输入目录</label><input type="text" id="graph_input_dir" placeholder="留空使用默认"></div>
  </details>
</div></details>

<details class="card" id="sec-ingest"><summary><span class="num">3</span><h2>导入与质量门</h2><span class="summary" id="sum-ingest"></span></summary><div class="card-body">
  <p class="hint">质量校验恒定开启；未通过的文件必须人工放行。</p>
  <div class="row"><label>质量预设</label><select id="quality_profile"><option value="">默认 standard</option><option value="standard">standard</option><option value="strict">strict</option><option value="loose">loose</option><option value="custom">custom</option></select></div>
  <details class="advanced"><summary>自定义质量阈值</summary>
    <div class="row"><label>最少字符</label><input type="number" id="quality_min_chars" min="0"></div>
    <div class="row"><label>可读比例</label><input type="number" id="quality_min_readable_ratio" min="0" max="1" step="0.01"></div>
    <div class="row"><label>乱码上限</label><input type="number" id="quality_max_garbled_ratio" min="0" max="1" step="0.01"></div>
    <div class="row"><label>重复行上限</label><input type="number" id="quality_max_repeat_ratio" min="0" max="1" step="0.01"></div>
    <div class="row"><label>每页字符</label><input type="number" id="quality_min_chars_per_page" min="0"></div>
    <div class="row"><label>及格分</label><input type="number" id="quality_pass_score" min="0" max="100"></div>
    <div class="row"><label>未识别图片</label><input type="number" id="quality_max_unocr_images" min="0"></div>
  </details>
  <div class="row"><label>入库确认</label><select id="ingest_confirm"><option value="">默认 always</option><option value="always">每次确认</option><option value="auto">自动建议</option><option value="off">直接入库</option></select></div>
  <div class="row"><label>待确认保留</label><input type="number" id="ingest_ttl_hours" min="0" placeholder="24 小时"></div>
  <div class="subhead">收件箱</div>
  <div class="row"><label>启用轮询</label><select id="inbox_enabled"><option value="">默认关闭</option><option value="true">开启</option><option value="false">关闭</option></select></div>
  <div class="row"><label>扫描间隔</label><input type="number" id="inbox_poll_seconds" min="3" max="600" placeholder="10 秒"></div>
  <div class="row"><label>收件箱确认</label><select id="inbox_confirm"><option value="">默认 always</option><option value="always">每次确认</option><option value="auto">自动建议</option><option value="off">直接入库</option></select></div>
  <p class="note" id="inboxState">读取中…</p>
</div></details>

<details class="card" id="sec-ocr"><summary><span class="num">4</span><h2>OCR</h2><span class="summary" id="sum-ocr"></span></summary><div class="card-body">
  <p class="hint">默认关闭，不向外部发送文件。</p>
  <div class="row"><label>模式</label><select id="ocr_mode"><option value="">默认 off</option><option value="off">关闭</option><option value="manual">手动</option><option value="auto">自动</option></select></div>
  <div class="row"><label>提供方</label><select id="ocr_provider"><option value="">默认 none</option><option value="none">禁用</option><option value="paddle">云端 PaddleOCR</option><option value="local">本机 PaddleOCR</option><option value="stub">离线替身</option></select></div>
  <div class="row"><label>内嵌图片</label><select id="ocr_image_ocr"><option value="">默认 false</option><option value="true">识别</option><option value="false">忽略</option></select></div>
  <div class="row"><label>Token</label><input type="password" id="ocr_token" placeholder="留空保持不变"><button type="button" class="ghost" data-clear="ocr_token">清除</button></div>
  <details class="advanced"><summary>服务与模型</summary>
    <div class="row"><label>服务地址</label><input type="text" id="ocr_base_url"></div>
    <div class="row"><label>模型</label><input type="text" id="ocr_model"></div>
    <div class="row"><label>语言</label><input type="text" id="ocr_lang" placeholder="ch"></div>
    <div class="row"><label>设备</label><select id="ocr_device"><option value="">默认 cpu</option><option value="cpu">CPU</option><option value="gpu">GPU</option></select></div>
    <div class="row"><label>文件上限</label><input type="number" id="ocr_max_file_mb" min="1"></div>
    <div class="row"><label>本机模型目录</label><input type="text" id="ocr_local_model_dir"></div>
  </details>
</div></details>

<details class="card" id="sec-access"><summary><span class="num">5</span><h2>应用与访问</h2><span class="summary" id="sum-access"></span></summary><div class="card-body">
  <div class="row"><label>上传上限</label><input type="number" id="app_max_upload_size" min="1" placeholder="字节，默认 104857600"></div>
  <div class="row"><label>允许扩展名</label><input type="text" id="app_allowed_extensions" placeholder=".txt,.md,.pdf,.docx"></div>
  <div class="row"><label>日志级别</label><select id="app_log_level"><option value="">默认 INFO</option><option value="DEBUG">DEBUG</option><option value="INFO">INFO</option><option value="WARNING">WARNING</option><option value="ERROR">ERROR</option></select></div>
  <div class="row"><label>技能路由</label><select id="app_skill_routing"><option value="">默认 off</option><option value="off">关闭</option><option value="on">开启</option></select></div>
  <div class="row"><label>生成方式</label><select id="app_generation_mode" disabled><option value="upstream">LightRAG 上游</option></select></div>
  <div class="subhead">局域网设备</div>
  <div class="pair-box"><div id="accessPairUrl" class="pair-url">读取中…</div><button type="button" id="accessCopyUrl" class="ghost">复制地址</button><button type="button" id="accessDevicesRefresh" class="ghost">刷新</button></div>
  <div id="accessRequestList" class="device-list"></div>
  <div id="accessDeviceList" class="device-list"></div>
  <div class="subhead">记忆</div>
  <div class="row"><label>状态</label><span id="memoryState" class="muted">读取中…</span></div>
  <div class="row"><label>记录数</label><span id="memoryCount" class="muted">—</span></div>
  <p class="note">M2：原始对话持久化与 M5 记忆管理页已提供。<a href="/memory" target="_blank" rel="noopener">打开记忆管理</a> · <a href="/api/memory/items" target="_blank" rel="noopener">查看 JSON</a></p>
</div></details>

<details class="card" id="sec-diagnostics"><summary><span class="num">6</span><h2>诊断</h2><span class="summary" id="sum-diagnostics"></span></summary><div class="card-body">
  <div class="row"><label>配置文件</label><span id="settingsFile" class="muted">读取中…</span></div>
  <div class="row"><label>重启状态</label><span id="restartState" class="muted">—</span></div>
  <p><button type="button" id="testBtn" class="btn">测试连接</button></p>
  <ul id="testList" class="checks"></ul>
  <table><tbody id="effectiveRows"></tbody></table>
</div></details>
</main>
</div>
<div class="bar"><button type="button" id="saveBtn" class="btn primary">保存配置</button><button type="button" id="reloadBtn" class="btn">重新加载</button><span id="dirty" class="dirty" hidden></span><span id="status" class="status"></span></div>
<script>
const SPECS = [
 ["llm","binding"],["llm","model"],["llm","host"],["llm","api_key"],
 ["embedding","binding"],["embedding","model"],["embedding","host"],["embedding","api_key"],["embedding","dim"],["embedding","send_dim"],
 ["rerank","binding"],["rerank","model"],["rerank","host"],["rerank","api_key"],
 ["vector_store","type"],["vector_store","qdrant_url"],
 ["rag","chunk_size"],["rag","chunk_overlap"],["rag","top_k"],["rag","chunk_top_k"],
 ["paths","lightrag_home"],["graph","working_dir"],["graph","input_dir"],
 ["quality","profile"],["quality","min_chars"],["quality","min_readable_ratio"],["quality","max_garbled_ratio"],["quality","max_repeat_ratio"],["quality","min_chars_per_page"],["quality","pass_score"],["quality","max_unocr_images"],
 ["ingest","confirm"],["ingest","ttl_hours"],["inbox","enabled"],["inbox","poll_seconds"],["inbox","confirm"],
 ["ocr","mode"],["ocr","provider"],["ocr","image_ocr"],["ocr","token"],["ocr","base_url"],["ocr","model"],["ocr","lang"],["ocr","device"],["ocr","max_file_mb"],["ocr","local_model_dir"],
 ["app","max_upload_size"],["app","allowed_extensions"],["app","log_level"],["app","skill_routing"],["app","generation_mode"]
];
const SECRETS = new Set(["llm.api_key","embedding.api_key","rerank.api_key","ocr.token"]);
const SECTIONS = [
 {id:"sec-models",num:"1",name:"模型"},{id:"sec-knowledge",num:"2",name:"知识库"},
 {id:"sec-ingest",num:"3",name:"导入"},{id:"sec-ocr",num:"4",name:"OCR"},
 {id:"sec-access",num:"5",name:"访问"},{id:"sec-diagnostics",num:"6",name:"诊断"}
];
const S = {};
let DATA = null, BASELINE = {}, PENDING_CLEAR = new Set();
const byId = id => document.getElementById(id);
const fieldId = (g,k) => g + "_" + k;
function setStatus(text, ok) { const n=byId("status"); n.textContent=text||""; n.className="status"+(ok===true?" ok":ok===false?" bad":""); }
function nav() { const box=byId("navlist"); SECTIONS.forEach(s=>{const b=document.createElement("div");b.className="nav-item";b.innerHTML='<span>'+s.num+'</span><span></span>';b.lastChild.textContent=s.name;b.addEventListener("click",()=>{byId(s.id).open=true;byId(s.id).scrollIntoView({behavior:"smooth",block:"start"});});box.appendChild(b);}); }
function snapshot() { BASELINE={}; for(const [g,k] of SPECS){const n=byId(fieldId(g,k));if(!n)continue;BASELINE[g+"."+k]=SECRETS.has(g+"."+k)?"":n.value;} PENDING_CLEAR.clear(); document.querySelectorAll("[data-clear]").forEach(b=>b.classList.remove("pending")); renderDirty(); }
function isDirty() { return SPECS.some(([g,k])=>{const key=g+"."+k;if(PENDING_CLEAR.has(k))return true;const n=byId(fieldId(g,k));if(!n)return false;if(SECRETS.has(key))return n.value.trim()!=="";return n.value!==BASELINE[key];}); }
function renderDirty() { const d=byId("dirty"); const n=SPECS.filter(([g,k])=>{const key=g+"."+k;if(PENDING_CLEAR.has(k))return true;const x=byId(fieldId(g,k));return x&&(SECRETS.has(key)?x.value.trim()!=="":x.value!==BASELINE[key]);}).length; d.hidden=!n; d.textContent=n?("未保存 "+n+" 项"):""; }
function setValue(g,k,v){const n=byId(fieldId(g,k));if(!n)return;if(SECRETS.has(g+"."+k)){const masked=String(v||"");n.value="";n.placeholder=masked?("已保存 "+masked+"，留空保持不变"):"未配置";}else{if(typeof v==="boolean")v=v?"true":"false";n.value=v==null?"":String(v);}}
function fill(data){DATA=data;const s=data.settings||{};for(const [g,k] of SPECS)setValue(g,k,(s[g]||{})[k]);snapshot();byId("settingsFile").textContent=data.settings_file||"—";const r=byId("restartState");r.textContent=data.restart_needed?"有改动待重启":"已生效";r.className=data.restart_needed?"bad":"ok";renderEffective(data);renderSummaries(data);}
function collect(){const body={};for(const [g,k] of SPECS){const n=byId(fieldId(g,k));if(!n)continue;const key=g+"."+k;if(SECRETS.has(key)&&n.value.trim()==="")continue;(body[g]||(body[g]={}))[k]=n.value;}if(PENDING_CLEAR.size)body.clear_secrets=[...PENDING_CLEAR].map(k=>{const p=SPECS.find(([g,x])=>x===k);return [p[0],p[1]];});return body;}
async function request(url,opt){const r=await fetch(url,opt);let d={};try{d=await r.json();}catch(e){}if(!r.ok){const detail=d.detail;throw new Error(typeof detail==="string"?detail:(detail&&detail.message)||("HTTP "+r.status));}return d;}
async function load(quiet){setStatus(quiet?"":"读取设置…");try{const d=await request("/api/settings",{cache:"no-store"});fill(d);setStatus(quiet?"已重新加载":"已加载",true);refreshMemoryStatus();loadAccess();}catch(e){setStatus("读取失败："+e.message,false);}}
async function save(){const btn=byId("saveBtn");btn.disabled=true;setStatus("保存中…");try{const d=await request("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(collect())});fill(d);setStatus("已保存"+(d.restart_needed?"，请重启应用":""),true);}catch(e){setStatus("保存失败："+e.message,false);}finally{btn.disabled=false;}}
async function test(){const btn=byId("testBtn");btn.disabled=true;setStatus("测试连接…");try{const d=await request("/api/settings/test",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});const box=byId("testList");box.textContent="";for(const c of (d.checks||[])){const li=document.createElement("li");li.className=c.ok?"ok":"bad";li.textContent=(c.ok?"✓ ":"✗ ")+c.name+"："+(c.detail||"");box.appendChild(li);}setStatus(d.all_ok?"连接正常":"部分连接异常",!!d.all_ok);}catch(e){setStatus("测试失败："+e.message,false);}finally{btn.disabled=false;}}
function renderEffective(data){const lr=data.lightrag_effective||{},app=data.app_effective||{},rows=[["LightRAG",app.lightrag_url||lr.LIGHTRAG_URL||"—"],["生成模型",[(lr.LLM_BINDING||""),(lr.LLM_MODEL||"")].filter(Boolean).join(" / ")||"—"],["嵌入模型",[(lr.EMBEDDING_BINDING||""),(lr.EMBEDDING_MODEL||"")].filter(Boolean).join(" / ")||"—"],["向量存储",lr.LIGHTRAG_VECTOR_STORAGE||"—"],["分块",(lr.CHUNK_SIZE||"默认")+" / 重叠 "+(lr.CHUNK_OVERLAP_SIZE||"默认")],["召回",(lr.TOP_K||"默认")+" / 片段 "+(lr.CHUNK_TOP_K||"默认")],["OCR",(data.ocr_effective&&data.ocr_effective.mode)||"—"]];const body=byId("effectiveRows");body.textContent="";rows.forEach(([a,b])=>{const tr=document.createElement("tr"),td1=document.createElement("td"),td2=document.createElement("td");td1.textContent=a;td2.textContent=b;tr.append(td1,td2);body.appendChild(tr);});}
function renderSummaries(data){const s=data.settings||{},v=(g,k)=>(s[g]||{})[k]||"";byId("sum-models").textContent=[v("llm","binding"),v("llm","model")].filter(Boolean).join(" / ")||"未设置";byId("sum-knowledge").textContent=v("rag","chunk_size")?(v("rag","chunk_size")+" / 块"):"默认";byId("sum-ingest").textContent=v("ingest","confirm")||"always";byId("sum-ocr").textContent=v("ocr","mode")||"off";byId("sum-access").textContent="局域网 "+(document.body.dataset.lan==="1"?"开启":"按需");byId("sum-diagnostics").textContent=data.restart_needed?"待重启":"正常";const inbox=data.inbox_effective||{};byId("inboxState").textContent=(inbox.enabled?"收件箱开启":"收件箱关闭")+" · "+((inbox.dirs||{}).inbox||"用户数据目录")+" · 确认 "+(inbox.confirm||"always");}
function copyText(text){if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(text);const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();}
async function loadAccess(){try{const info=await request("/api/app/access/connect-info",{cache:"no-store"});byId("accessPairUrl").textContent=info.url||"—";byId("accessPairUrl").dataset.url=info.url||"";}catch(e){byId("accessPairUrl").textContent="仅本机可管理局域网设备";}try{const r=await request("/api/app/access/requests",{cache:"no-store"});renderAccessRequests(r.requests||[]);}catch(e){renderAccessRequests([]);}try{const d=await request("/api/app/access/devices",{cache:"no-store"});renderAccessDevices(d.devices||[]);}catch(e){renderAccessDevices([]);}}
function deviceRow(item,requestMode){const row=document.createElement("div");row.className="device";const main=document.createElement("div");main.className="device-main";const name=document.createElement("div");name.className="device-name";name.textContent=item.name||"未命名设备";const meta=document.createElement("div");meta.className="device-meta";meta.textContent=requestMode?("请求时间 "+(item.created_at||"—")):("最近使用 "+(item.last_seen_at||"—"));main.append(name,meta);const actions=document.createElement("div");actions.className="device-actions";row.append(main,actions);return {row,actions};}
function renderAccessRequests(items){const box=byId("accessRequestList");box.textContent="";items.forEach(item=>{const {row,actions}=deviceRow(item,true);const no=document.createElement("button");no.textContent="忽略";no.onclick=async()=>{await request("/api/app/access/requests/"+encodeURIComponent(item.id),{method:"DELETE"});loadAccess();};const yes=document.createElement("button");yes.className="allow";yes.textContent="允许";yes.onclick=async()=>{await request("/api/app/access/requests/"+encodeURIComponent(item.id)+"/approve",{method:"POST"});loadAccess();};actions.append(no,yes);box.appendChild(row);});}
function renderAccessDevices(items){const box=byId("accessDeviceList");box.textContent="";items.forEach(item=>{const {row,actions}=deviceRow(item,false);const del=document.createElement("button");del.textContent="删除";del.onclick=async()=>{if(!confirm("删除设备 "+(item.name||"")+"？"))return;await request("/api/app/access/devices/"+encodeURIComponent(item.id),{method:"DELETE"});loadAccess();};actions.appendChild(del);box.appendChild(row);});}
async function refreshMemoryStatus(){try{const d=await request("/api/memory/status",{cache:"no-store"});byId("memoryState").textContent=d.enabled?(d.ready?"已启用":"已启用但未就绪"):"未启用";byId("memoryCount").textContent=d.enabled?((d.memory_count||0)+" 条 / 待确认 "+(d.pending_memory_count||0)):"—";}catch(e){byId("memoryState").textContent="读取失败";}}
function initClearButtons(){document.querySelectorAll("[data-clear]").forEach(b=>{b.addEventListener("click",()=>{const id=b.dataset.clear;const n=byId(id);if(!n)return;PENDING_CLEAR.add(id);n.value="";n.placeholder="保存后清除";b.classList.add("pending");renderDirty();});});}
function init(){nav();document.querySelectorAll("input,select").forEach(n=>{n.addEventListener("input",renderDirty);n.addEventListener("change",renderDirty);});byId("saveBtn").addEventListener("click",save);byId("reloadBtn").addEventListener("click",()=>load(false));byId("testBtn").addEventListener("click",test);byId("accessDevicesRefresh").addEventListener("click",loadAccess);byId("accessCopyUrl").addEventListener("click",()=>{const url=byId("accessPairUrl").dataset.url||"";if(url){copyText(url);setStatus("地址已复制",true);}});initClearButtons();window.addEventListener("beforeunload",e=>{if(isDirty()){e.preventDefault();e.returnValue="";}});load(false);}
init();
</script>
<script src="/static/session.js" defer></script>
</body>
